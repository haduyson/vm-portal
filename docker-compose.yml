services:
  db:
    image: postgres:16
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    environment:
      POSTGRES_USER: ${DB_USER:-vmadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-vmportal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-database.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${DB_USER:-vmadmin} -d ${DB_NAME:-vmportal}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /var/lock/qemu-server:/var/lock/qemu-server:ro
      - /etc/cloudflared:/etc/cloudflared

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  postgres_data:
